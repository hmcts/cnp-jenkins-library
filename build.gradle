import org.codehaus.groovy.ast.ClassCodeVisitorSupport
import org.codehaus.groovy.ast.ClassNode
import org.codehaus.groovy.ast.expr.GStringExpression
import org.codehaus.groovy.ast.expr.PropertyExpression
import org.codehaus.groovy.ast.expr.VariableExpression
import org.codehaus.groovy.ast.builder.AstBuilder
import org.codehaus.groovy.control.CompilePhase
import org.codehaus.groovy.control.SourceUnit

plugins {
  id 'groovy'
}

repositories {

  mavenCentral()
  maven {
    url 'https://repo.jenkins-ci.org/public/'
  }
}

test {
  systemProperty 'groovy.grape.enable', 'false'
  maxHeapSize = '1g'

  reports {
    html.required = true
    html.outputLocation = file("$project.buildDir/reports/html")
  }
  ignoreFailures = true

  // show test results
  def results = []
  afterSuite { desc, result ->
    if (desc.className) { results << result }
  }

  // show summary
  doLast {
    println "Tests: ${results.sum { it.testCount }}" +
      ", Failures: ${results.sum { it.failedTestCount }}" +
      ", Errors: ${results.sum { it.exceptions.size() }}" +
      ", Skipped: ${results.sum { it.skippedTestCount }}"
  }
}

compileGroovy {
  groovyOptions.forkOptions.jvmArgs = [ '-Dgroovy.grape.enable=false' ]
  // @CNP annotation comes from the Jenkins Runtime instance
  exclude '**/pluginActive.groovy'
}

compileTestGroovy {
  groovyOptions.forkOptions.jvmArgs = [ '-Dgroovy.grape.enable=false' ]
}

dependencies {
  implementation group: 'com.cloudbees', name: 'groovy-cps', version: '3773.v505e0052522c'
  testImplementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'

  implementation group: 'org.jenkins-ci.main', name: 'jenkins-core', version: '2.460'
  implementation group: 'org.jenkins-ci.plugins.workflow', name: 'workflow-step-api', version: '657.v03b_e8115821b_', ext: 'jar'
  implementation group: 'org.jenkinsci.plugins', name: 'pipeline-model-definition', version: '2.2221.vc657003fb_d93', ext: 'jar'
  implementation 'org.jenkins-ci.plugins:job-dsl-core:1.90'
  implementation group: 'org.jenkins-ci.plugins', name: 'scm-api', version: '616.ve67136f6c77d', ext: 'jar'

  testImplementation 'junit:junit:4.13.2'
  testImplementation group: 'org.spockframework', name: 'spock-core', version: '1.3-groovy-2.4'
  testImplementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.16.0'

  testImplementation (group: 'com.lesfurets', name: 'jenkins-pipeline-unit', version: '1.17')
  testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.24.2'
  testImplementation group: 'net.javacrumbs.json-unit', name: 'json-unit-fluent', version: '2.36.0'

  testRuntimeOnly 'org.objenesis:objenesis:3.3'
}


sourceSets {
  jobs {
    groovy {
      srcDirs 'jobs'
      compileClasspath += main.compileClasspath
    }
  }

  main {
    groovy {
      srcDirs = ["$project.rootDir/src", "$project.rootDir/vars"]
    }
  }
  test {
    groovy {
      srcDirs = ["$project.rootDir/test"]
    }
    resources {
      srcDirs = ["$project.rootDir/testResources"]
    }
  }
}

def pipelineSourceFiles = fileTree(projectDir) {
  include 'src/**/*.groovy'
  include 'vars/**/*.groovy'
}

tasks.register('lintInsecureSecretInterpolation') {
  group = 'verification'
  description = 'Fails when credential-bound values are Groovy-interpolated into sensitive Pipeline steps.'
  inputs.files(pipelineSourceFiles)

  doLast {
    def bindingVariablePattern = ~/(?:envVariable|passwordVariable|usernameVariable|variable|keyFileVariable)\s*:\s*['"]([A-Z][A-Z0-9_]*)['"]/
    def credentialsAssignmentPattern = ~/(?:def|String)?\s*([A-Z][A-Z0-9_]*)\s*=\s*(?:steps\.)?credentials\s*\(/
    def sensitiveVariables = [] as Set

    pipelineSourceFiles.files.each { sourceFile ->
      sourceFile.text.eachMatch(bindingVariablePattern) { match ->
        sensitiveVariables << match[1]
      }
      sourceFile.text.eachMatch(credentialsAssignmentPattern) { match ->
        sensitiveVariables << match[1]
      }
    }

    def violations = []
    pipelineSourceFiles.files.each { sourceFile ->
      def visitor = new ClassCodeVisitorSupport() {
        @Override
        protected SourceUnit getSourceUnit() {
          null
        }

        @Override
        void visitGStringExpression(GStringExpression expression) {
          expression.values.each { value ->
            def variableName = value instanceof PropertyExpression ? value.propertyAsString :
              value instanceof VariableExpression ? value.name : null
            if (variableName in sensitiveVariables) {
              violations << "${project.relativePath(sourceFile)}:${expression.lineNumber}: insecure interpolation of ${variableName}"
            }
          }
          super.visitGStringExpression(expression)
        }
      }
      new AstBuilder().buildFromString(CompilePhase.CONVERSION, false, sourceFile.text).each { node ->
        if (node instanceof ClassNode) {
          node.visitContents(visitor)
        } else {
          node.visit(visitor)
        }
      }
    }

    if (!violations.empty) {
      throw new GradleException("Insecure credential interpolation found:\n${violations.join('\n')}")
    }
  }
}

check.dependsOn(tasks.named('lintInsecureSecretInterpolation'))
